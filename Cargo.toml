[package]
name = "jacks"
version = "0.1.0"
edition = "2024"
description = "A 9/6 Jacks or Better video poker strategy trainer"
license = "MIT"
repository = "https://github.com/0xv1n/jacks-or-better"

[dependencies]
eframe = { version = "0.35", features = ["persistence"] }
rand = "0.10"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
